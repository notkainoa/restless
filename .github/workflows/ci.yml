name: CI

# Build-only validation. No secrets, ad-hoc signing — just proves the app
# compiles and the icon lands in the bundle on every push / PR.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Build (ad-hoc, unsigned)
        run: ./build.sh

      - name: Verify the app icon compiled into the bundle
        run: |
          set -euo pipefail
          test -f dist/Restless.app/Contents/Resources/Assets.car
          test -d dist/Restless.app/Contents/PlugIns/RestlessControl.appex
          name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" dist/Restless.app/Contents/Info.plist)
          [ "$name" = "AppIcon" ] || { echo "CFBundleIconName is '$name', expected AppIcon"; exit 1; }
          echo "✅ icon present (Assets.car + CFBundleIconName=AppIcon)"
