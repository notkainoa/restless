<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Restless: an open eye whose iris is a full moon. Awake through the night. -->
  <defs>
    <!-- Night-sky tile: violet dusk at the top falling to deep midnight indigo -->
    <linearGradient id="tile" x1="0.35" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#5c45d8"/>
      <stop offset="0.5" stop-color="#2c1f7c"/>
      <stop offset="1" stop-color="#110a34"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fb4ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Eyelids: moonlit white to soft lavender -->
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ece8ff"/>
      <stop offset="1" stop-color="#b9afff"/>
    </linearGradient>
    <!-- Inside of the eye: a deeper slice of night -->
    <radialGradient id="socket" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#241a6e"/>
      <stop offset="1" stop-color="#0b0628"/>
    </radialGradient>
    <!-- The moon: lit from upper left, soft lavender terminator -->
    <radialGradient id="moon" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f1eeff"/>
      <stop offset="0.8" stop-color="#bdb3fb"/>
      <stop offset="1" stop-color="#8f82ea"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#b3c4ff" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#8b7cf0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b7cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a8cec" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#9a8cec" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9a8cec" stop-opacity="0"/>
    </radialGradient>

    <path id="outer" d="M168 512 C296 326 408 266 512 266 C616 266 728 326 856 512 C728 694 616 752 512 752 C408 752 296 694 168 512 Z"/>
    <path id="inner" d="M168 512 C318 386 420 348 512 348 C604 348 706 386 856 512 C718 648 612 698 512 698 C412 698 306 648 168 512 Z"/>
    <clipPath id="innerClip"><use href="#inner"/></clipPath>
    <clipPath id="tileClip"><rect x="96" y="96" width="832" height="832" rx="196" ry="196"/></clipPath>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#tile)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#vignette)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#tileSheen)"/>

  <!-- A few quiet stars (fade out naturally at small sizes) -->
  <g fill="#ffffff" clip-path="url(#tileClip)">
    <circle cx="262" cy="250" r="7" fill-opacity="0.55"/>
    <circle cx="742" cy="214" r="5" fill-opacity="0.45"/>
    <circle cx="810" cy="330" r="4" fill-opacity="0.35"/>
    <circle cx="212" cy="780" r="4" fill-opacity="0.25"/>
    <circle cx="790" cy="810" r="5" fill-opacity="0.25"/>
    <path d="M330 168 Q333 186 351 189 Q333 192 330 210 Q327 192 309 189 Q327 186 330 168 Z" fill-opacity="0.6"/>
  </g>

  <!-- Soft aqua aura behind the eye -->
  <ellipse cx="512" cy="512" rx="400" ry="320" fill="url(#aura)"/>

  <!-- Drop shadow under the glyph -->
  <use href="#outer" transform="translate(0 26)" fill="#05021a" fill-opacity="0.55" filter="url(#shadow)"/>

  <!-- Eye interior -->
  <use href="#inner" fill="url(#socket)"/>
  <g clip-path="url(#innerClip)">
    <circle cx="512" cy="518" r="240" fill="url(#moonGlow)"/>
    <!-- Moon -->
    <circle cx="512" cy="518" r="142" fill="url(#moon)"/>
    <ellipse cx="556" cy="476" rx="46" ry="38" fill="url(#mare)"/>
    <ellipse cx="478" cy="566" rx="58" ry="44" fill="url(#mare)"/>
    <ellipse cx="582" cy="574" rx="26" ry="22" fill="url(#mare)"/>
    <!-- Upper lid casts a soft shadow into the eye -->
    <path d="M168 512 C318 386 420 348 512 348 C604 348 706 386 856 512 L856 330 L168 330 Z"
          transform="translate(0 22)" fill="#070320" fill-opacity="0.55" filter="url(#soft)"/>
  </g>

  <!-- Eyelids (tapered to sharp corners) -->
  <path fill-rule="evenodd" fill="url(#lid)"
        d="M168 512 C296 326 408 266 512 266 C616 266 728 326 856 512 C728 694 616 752 512 752 C408 752 296 694 168 512 Z
           M168 512 C318 386 420 348 512 348 C604 348 706 386 856 512 C718 648 612 698 512 698 C412 698 306 648 168 512 Z"/>
  <!-- Highlight along the top of the upper lid -->
  <path d="M252 422 C342 320 430 282 512 282 C594 282 682 320 772 422"
        fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>

  <!-- Crisp hairline on the tile edge -->
  <rect x="97" y="97" width="830" height="830" rx="195" ry="195" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
